# Spring Application Config
spring.application.name=multi-cloud-cost-dashboard

# H2 Database configuration (Default for zero-setup local execution)
spring.datasource.url=jdbc:h2:mem:costdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# MySQL Database configuration (Uncomment to use Docker MySQL container)
# spring.datasource.url=jdbc:mysql://localhost:3306/costdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=rootpassword
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console configurations (Accessible at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Mail server settings (Configured for MailDev in Docker Compose)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Logging configurations
logging.level.org.springframework.security=INFO
logging.level.com.multicloud.costmonitor=INFO

server.port=8081